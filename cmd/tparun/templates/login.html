<!doctype html>
<html lang="en">
<head>{{template "head" "Log in"}}</head>
<body>
{{template "header" "account"}}
<main id="main" class="form-page" tabindex="-1">
  <p class="eyebrow">Your account</p>
  <h1>Welcome back.</h1>
  <p class="lead">Log in to view your usage and account status.</p>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button" type="submit">Log in</button>
  </form>
  <p class="fine">New to TPA.run? <a href="/register">Create an account</a></p>
  <p class="fine">Just installing public packages? <a href="/docs#consume">No account is required.</a></p>
</main>
{{template "footer"}}
</body>
</html>
