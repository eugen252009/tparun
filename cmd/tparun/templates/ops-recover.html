<!doctype html>
<html lang="en">
<head>{{template "head" "Operator recovery"}}</head>
<body>
{{template "operator-header"}}
<main id="main" class="form-page" tabindex="-1">
  <p class="eyebrow">Emergency recovery</p><h1>Recover operator access</h1>
  <p>Enter the one-time code generated by the privileged server command. Keep this code private.</p>
  <form method="post" action="/ops/recover" data-recovery-form>
    <label for="recovery-code">Recovery code</label>
    <input id="recovery-code" name="recovery_code" autocomplete="one-time-code" required maxlength="256">
    <button class="button" type="submit">Continue</button>
  </form>
  <p class="fine"><a href="/ops/login">Back to operator sign in</a></p>
</main>
{{template "footer"}}
<script src="/static/ops-auth.js"></script>
</body>
</html>
