services:
  tparun:
    image: ${TPARUN_IMAGE:?set TPARUN_IMAGE to a pinned image tag or digest}
    restart: unless-stopped
    user: "${TPARUN_UID:-10001}:${TPARUN_GID:-10001}"
    ports:
      - "${TPARUN_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - "${TPARUN_CONFIG_DIR:?set TPARUN_CONFIG_DIR}:/config"
      - "${TPARUN_DATA_DIR:?set TPARUN_DATA_DIR}:/data"
    environment:
      HOME: /config/home
      TPARUN_PROFILE: self-hosted
      TPARUN_LISTEN: 0.0.0.0:8080
      TPARUN_DATA_DIR: /data
      TPA_BIN: /usr/local/bin/tpa
      GNUPGHOME: /config/gnupg
      TPARUN_REGISTRATION_ENABLED: "true"
      TPARUN_CAPABILITY_SOURCE: local
      TPARUN_BILLING: none
      TPARUN_BILLING_PROVIDER: none
      TPARUN_DELIVERY_MODE: metrics-only
      TPARUN_EGRESS_ENFORCEMENT: none
      TPARUN_OPERATOR_RP_ID: ${TPARUN_OPERATOR_RP_ID:?set public hostname}
      TPARUN_OPERATOR_ORIGIN: ${TPARUN_EXTERNAL_ORIGIN:?set https external origin}
    # TPA's existing publication runner creates a nested user/mount namespace
    # and a bounded tmpfs. Docker's default seccomp/AppArmor profiles reject
    # that operation even for this non-root UID; these are the narrow runtime
    # permissions required by that existing sandbox (not privileged mode).
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
